name: Benchmark report
description: Contribute reproducible benchmark results (latency and/or relevance)
title: "[Benchmark]: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for *contributing benchmark numbers* (a comparison, a new dataset,
        a quality result). For a suspected regression or "it's slow" report, use
        the **Performance report** template instead.

        A benchmark is only useful if someone else can reproduce it, so please fill
        in the full provenance below. See
        [benchmarks/README.md](https://github.com/mayflower/pgturbohybrid/blob/main/benchmarks/README.md).
  - type: input
    id: dataset
    attributes:
      label: Dataset (name and version)
      placeholder: "dbpedia-openai-1M, BEIR/nfcorpus, glove-100-angular, ..."
    validations:
      required: true
  - type: input
    id: rows
    attributes:
      label: Row count
      placeholder: "1,000,000"
    validations:
      required: true
  - type: input
    id: dimensions
    attributes:
      label: Vector dimensions
      placeholder: "1536"
    validations:
      required: true
  - type: input
    id: query-count
    attributes:
      label: Query count
      placeholder: "10,000"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware (CPU model, cores, RAM)
      placeholder: "AWS c6i.4xlarge, Intel Xeon 8375C, 16 vCPU, 32 GB"
    validations:
      required: true
  - type: input
    id: cache-state
    attributes:
      label: Cache state
      description: Cold or warm, and how warm-up was reached (e.g. steady-state after an untimed warm-up pass).
      placeholder: "warm / steady state"
    validations:
      required: true
  - type: input
    id: warmup-policy
    attributes:
      label: Warm-up policy
      description: Number of untimed warm-up passes and timed/measured passes.
      placeholder: "1 untimed warm-up pass, 3 measured passes"
    validations:
      required: true
  - type: textarea
    id: index-definition
    attributes:
      label: Index definition and settings
      description: The CREATE INDEX statement, reloptions, turbohybrid profile, candidate budgets (dense_k/bm25_k/sparse_k/final_k), and any non-default turbohybrid.* GUCs.
      render: sql
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PostgreSQL, pgvector ref, pgturbohybrid commit/tag, and the SIMD/MATH build mode.
      placeholder: "PG17, pgvector v0.8.2, pgturbohybrid <sha>, SIMD_BUILD=native MATH_MODE=strict"
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Baseline
      description: What you are comparing against (pgvector HNSW, SQL RRF, another engine, another profile).
      placeholder: "pgvector HNSW dense-only"
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Latency (p50/p95/p99 or queries/s) and relevance (recall@k, nDCG@10, MRR@10) for each configuration measured.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Benchmark command
      description: The exact command line used to produce these numbers.
      render: sh
    validations:
      required: true
  - type: textarea
    id: stats-json
    attributes:
      label: turbohybrid_last_scan_stats()
      description: Paste a representative scan-stats JSON when available.
      render: json
    validations:
      required: false
