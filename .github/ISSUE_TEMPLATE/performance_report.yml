name: Performance report
description: Share a reproducible benchmark or performance issue
title: "[Performance]: "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Performance reports are most useful when they include the dataset, exact settings, baselines, latency, quality metrics, and diagnostics.
  - type: input
    id: dataset-size
    attributes:
      label: Dataset size
      placeholder: "57,638 rows"
    validations:
      required: true
  - type: input
    id: vector-dimensions
    attributes:
      label: Vector dimensions
      placeholder: "1536"
    validations:
      required: true
  - type: input
    id: query-count
    attributes:
      label: Query count
      placeholder: "648"
    validations:
      required: true
  - type: textarea
    id: index-definition
    attributes:
      label: Index definition
      render: sql
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: turbohybrid profile
      placeholder: "latency, balanced, quality, or debug"
    validations:
      required: true
  - type: textarea
    id: candidate-budgets
    attributes:
      label: Candidate budgets
      description: Include dense_k, bm25_k, rrf_k, final_k, and whether values were defaults or explicit.
      render: text
    validations:
      required: true
  - type: textarea
    id: benchmark-command
    attributes:
      label: Benchmark command
      render: sh
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline
      description: Define the baseline, such as SQL RRF, pgvector HNSW dense-only, or another system.
    validations:
      required: true
  - type: input
    id: latency-p50
    attributes:
      label: p50 latency
      placeholder: "0.729 ms"
    validations:
      required: true
  - type: input
    id: latency-p95
    attributes:
      label: p95 latency
      placeholder: "0.910 ms"
    validations:
      required: true
  - type: input
    id: latency-p99
    attributes:
      label: p99 latency
      placeholder: "1.096 ms"
    validations:
      required: true
  - type: textarea
    id: quality-metrics
    attributes:
      label: Quality metrics
      description: Include nDCG@10, MRR@10, Recall@10, overlap@10, or other relevance metrics.
      render: text
    validations:
      required: true
  - type: textarea
    id: stats-json
    attributes:
      label: Stats JSON
      description: Paste `turbohybrid_last_scan_stats()` and any relevant benchmark artifact summary.
      render: json
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include PostgreSQL, pgvector, pgturbohybrid commit, OS, CPU, compiler, and relevant PostgreSQL settings.
    validations:
      required: true
