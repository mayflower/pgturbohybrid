name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Keyless (OIDC) cosign signing of release artifacts -- no maintainer keys.
  id-token: write

jobs:
  source-archive:
    name: source archive
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 18
          dev-files: true

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install
          createdb pgturbohybrid_pgvector_sanity
          psql -d pgturbohybrid_pgvector_sanity -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;"
          dropdb pgturbohybrid_pgvector_sanity

      - name: Build pgturbohybrid
        run: make clean && make

      - name: Install pgturbohybrid
        run: sudo --preserve-env=PG_CONFIG make install

      - name: Run installcheck
        run: make installcheck

      - name: Run TAP tests
        run: make prove_installcheck

      - name: Build source archive
        run: make dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Upload source archive to GitHub Release
        # Create the release with a PAT (RELEASE_PAT) so the resulting
        # "release: published" event triggers downstream workflows such as
        # homebrew.yml. A release created with the built-in GITHUB_TOKEN does
        # not trigger other workflows. Falls back to GITHUB_TOKEN when no PAT is
        # configured -- the release is still created, but homebrew.yml must then
        # be run manually via workflow_dispatch.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          # Release notes are derived from the tag name (GITHUB_REF_NAME), not
          # hardcoded.  The SQL/package version (EXTVERSION) may stay 0.1.0 even
          # when the tag is v0.1.0-alpha.N, so the artifact names come from the
          # Makefile while the notes file comes from the tag.
          EXTVERSION="$(sed -n 's/^EXTVERSION[[:space:]]*=[[:space:]]*//p' Makefile | head -n1)"
          NOTES_FILE="docs/release-notes/github-${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::release notes file not found: $NOTES_FILE" >&2
            echo "Create docs/release-notes/github-${GITHUB_REF_NAME}.md for this tag." >&2
            exit 1
          fi
          TARBALL="dist/pgturbohybrid-${EXTVERSION}.tar.gz"
          ZIP="dist/pgturbohybrid-${EXTVERSION}.zip"
          # SHA256 checksums for the source archives so downloads can be verified
          # (sha256sum -c dist/SHA256SUMS).
          ( cd dist && sha256sum "pgturbohybrid-${EXTVERSION}.tar.gz" \
              "pgturbohybrid-${EXTVERSION}.zip" > SHA256SUMS )
          SUMS="dist/SHA256SUMS"
          syft dir:. -o spdx-json="dist/pgturbohybrid-${EXTVERSION}.spdx.json"
          SBOM="dist/pgturbohybrid-${EXTVERSION}.spdx.json"
          # Keyless (Sigstore/OIDC) signatures so downloads can be verified for
          # authenticity, not just integrity, with no maintainer-held keys.
          # Verify, e.g.:
          #   cosign verify-blob --bundle <file>.cosign.bundle \
          #     --certificate-identity-regexp '^https://github.com/.*/pgturbohybrid/' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>
          for f in "$TARBALL" "$ZIP" "$SUMS" "$SBOM"; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
            cosign verify-blob --bundle "${f}.cosign.bundle" \
              --certificate-identity-regexp '^https://github.com/.*/pgturbohybrid/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" "$ZIP" "$SUMS" "$SBOM" \
              "${TARBALL}.cosign.bundle" "${ZIP}.cosign.bundle" "${SUMS}.cosign.bundle" "${SBOM}.cosign.bundle" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" "$ZIP" "$SUMS" "$SBOM" \
              "${TARBALL}.cosign.bundle" "${ZIP}.cosign.bundle" "${SUMS}.cosign.bundle" "${SBOM}.cosign.bundle" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi
