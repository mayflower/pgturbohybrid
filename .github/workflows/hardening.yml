name: hardening

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  strict-simd-disabled:
    name: strict math, SIMD disabled
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 18
          dev-files: true

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install

      # Build the WHOLE extension without SIMD.  Bare `make` only builds the
      # first object (the Makefile's first rule, $(OBJS): src/*.h, becomes the
      # default goal), so it never compiled the no-SIMD path -- use `make all`.
      - name: Build pgturbohybrid without SIMD
        run: make clean && make all SIMD_BUILD=none MATH_MODE=strict
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare

      # Install and test the no-SIMD build (carry SIMD_BUILD=none so the tested
      # library is the one just built, not a default portable rebuild).
      - name: Run regression tests
        run: |
          sudo --preserve-env=PG_CONFIG make install SIMD_BUILD=none MATH_MODE=strict
          make installcheck SIMD_BUILD=none MATH_MODE=strict
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: strict-simd-disabled-regression
          path: |
            regression.diffs
            regression.out
            log/
          if-no-files-found: ignore

  gcc:
    name: gcc strict build
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
      CC: gcc
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 18
          dev-files: true

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install

      - name: Build and test with gcc
        run: |
          make clean
          make MATH_MODE=strict
          sudo --preserve-env=PG_CONFIG make install
          make installcheck
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gcc-regression
          path: |
            regression.diffs
            regression.out
            log/
          if-no-files-found: ignore

  scan-build:
    name: clang static analyzer
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 18
          dev-files: true

      - name: Install analyzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install

      - name: Run scan-build
        # Build with assertions enabled so the analyzer can follow the
        # Assert()-documented invariants (non-zero divisors, non-NULL
        # pointers) the same way the sibling hardening jobs do. Without
        # -DUSE_ASSERT_CHECKING every Assert() expands to a no-op, so the
        # analyzer cannot see those invariants and reports false-positive
        # divide-by-zero / null-dereference paths.
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING
        run: |
          make clean
          scan-build --status-bugs --keep-going make MATH_MODE=strict
