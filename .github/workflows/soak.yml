name: soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Soak duration (100 is the short release profile)
        required: false
        default: '900'
  schedule:
    - cron: '23 2 * * 0'

concurrency:
  group: pgturbohybrid-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: pg17 pgvector-main soak
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PG_CONFIG: /usr/lib/postgresql/17/bin/pg_config
      SOAK_OUTPUT: soak-artifacts
      SOAK_SECONDS: ${{ inputs.duration_seconds || '900' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
          dev-files: true
      - name: Install build and soak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libipc-run-perl python3-psycopg2
          git clone --depth 1 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector-main"
          make -C "$RUNNER_TEMP/pgvector-main"
          sudo --preserve-env=PG_CONFIG make -C "$RUNNER_TEMP/pgvector-main" install
      - name: Build and install
        run: |
          make all
          sudo --preserve-env=PG_CONFIG make install
      - name: Run deterministic concurrent soak
        timeout-minutes: 25
        run: python3 benchmarks/soak/run_soak.py --seconds "$SOAK_SECONDS" --output "$SOAK_OUTPUT"
      - name: Run recovery and physical replication gates
        timeout-minutes: 15
        run: |
          mkdir -p "$SOAK_OUTPUT/tap"
          make prove_installcheck PROVE_TESTS='test/t/009_shared_cache_identity.pl test/t/010_native_vacuum_crash.pl test/t/012_recovery_replication.pl' 2>&1 | tee "$SOAK_OUTPUT/tap/recovery-replication.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-pgvector-main-soak
          path: soak-artifacts/
          if-no-files-found: error
