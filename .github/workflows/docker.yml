name: docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to GHCR (otherwise build-only)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  # PG major that also receives the unsuffixed :<version> and :latest tags.
  DEFAULT_PG_MAJOR: '18'
  PGVECTOR_REF: v0.8.2

jobs:
  image:
    name: image pg${{ matrix.pg_major }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Resolve version and tags
        id: meta
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${ref#v}"
          else
            version="$(grep -E '^EXTVERSION' Makefile | head -1 | awk '{print $3}')"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${version}-pg${{ matrix.pg_major }}"
          if [ "${{ matrix.pg_major }}" = "${DEFAULT_PG_MAJOR}" ]; then
            tags="${tags},${image}:${version},${image}:latest"
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to push
        id: push
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ inputs.push }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            PGVECTOR_REF=${{ env.PGVECTOR_REF }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_major }}
