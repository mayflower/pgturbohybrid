name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux pg${{ matrix.postgres }} pgvector-${{ matrix.pgvector_ref }}
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18, 19]
        pgvector_ref: [v0.8.2, master]
        exclude:
          - postgres: 19
            pgvector_ref: v0.8.2
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}
          dev-files: true

      - name: Build and install upstream pgvector
        env:
          PGVECTOR_REF: ${{ matrix.pgvector_ref }}
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-$PGVECTOR_REF"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch "$PGVECTOR_REF" https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install
          createdb pgturbohybrid_pgvector_sanity
          psql -d pgturbohybrid_pgvector_sanity -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;"
          psql -d pgturbohybrid_pgvector_sanity -v ON_ERROR_STOP=1 -c "SELECT '[1,2,3]'::vector;"
          dropdb pgturbohybrid_pgvector_sanity

      - name: Build pgturbohybrid
        run: make clean && make
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare

      - name: Install pgturbohybrid
        run: sudo --preserve-env=PG_CONFIG make install

      - name: Smoke test extensions
        run: |
          createdb pgturbohybrid_smoke
          psql -d pgturbohybrid_smoke -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;"
          psql -d pgturbohybrid_smoke -v ON_ERROR_STOP=1 -c "CREATE EXTENSION pgturbohybrid;"
          psql -d pgturbohybrid_smoke -v ON_ERROR_STOP=1 -c "SELECT '[1,0,0]'::vector <~-> turbohybrid_query(vector_query => '[1,0,0]'::vector);"
          dropdb pgturbohybrid_smoke

      - name: Run SQL regression tests
        run: make installcheck

      - name: Run TAP tests
        run: make prove_installcheck

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-pg${{ matrix.postgres }}-${{ matrix.pgvector_ref }}-regression
          path: |
            regression.diffs
            regression.out
            log/
          if-no-files-found: ignore

  perf-smoke:
    name: perf smoke fast defaults
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 18
          dev-files: true

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install

      - name: Build and install pgturbohybrid
        run: |
          make clean
          make
          sudo --preserve-env=PG_CONFIG make install
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare

      - name: Verify fast default path
        run: |
          createdb pgturbohybrid_perf_smoke
          psql -q -X -A -t -v ON_ERROR_STOP=1 \
            -d pgturbohybrid_perf_smoke \
            -f test/perf/perf_smoke_fast_defaults.sql \
            > perf-smoke-results.json
          python3 -m json.tool perf-smoke-results.json >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke-results
          path: perf-smoke-results.json
          if-no-files-found: error

  macos:
    name: ${{ matrix.os }} pg${{ matrix.postgres }} pgvector-${{ matrix.pgvector_ref }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            postgres: 18
            pgvector_ref: v0.8.2
          - os: macos-26
            postgres: 18
            pgvector_ref: master
          - os: macos-15-intel
            postgres: 17
            pgvector_ref: v0.8.2
          - os: macos-15-intel
            postgres: 17
            pgvector_ref: master
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}
          dev-files: true

      - name: Build and install upstream pgvector
        env:
          PGVECTOR_REF: ${{ matrix.pgvector_ref }}
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-$PGVECTOR_REF"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch "$PGVECTOR_REF" https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install
          createdb pgturbohybrid_pgvector_sanity
          psql -d pgturbohybrid_pgvector_sanity -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;"
          dropdb pgturbohybrid_pgvector_sanity

      - name: Build and install pgturbohybrid
        run: |
          make clean
          make
          sudo --preserve-env=PG_CONFIG make install

      - name: Run tests
        run: |
          make installcheck
          make prove_installcheck

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.os }}-pg${{ matrix.postgres }}-${{ matrix.pgvector_ref }}-regression
          path: |
            regression.diffs
            regression.out
            log/
          if-no-files-found: ignore

  i386:
    name: linux i386 pgvector-v0.8.2
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --platform linux/386
    steps:
      - name: Install PostgreSQL build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates git libipc-run-perl postgresql-15 postgresql-server-dev-15 sudo
          service postgresql start

      - name: Checkout pgturbohybrid
        run: |
          git clone https://github.com/${{ github.repository }}.git pgturbohybrid
          cd pgturbohybrid
          git fetch origin ${{ github.ref }}
          git reset --hard FETCH_HEAD

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR" install
          sudo -u postgres createdb pgturbohybrid_pgvector_sanity
          sudo -u postgres psql -d pgturbohybrid_pgvector_sanity -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;"
          sudo -u postgres dropdb pgturbohybrid_pgvector_sanity

      - name: Build and install pgturbohybrid
        working-directory: pgturbohybrid
        run: |
          make clean
          make
          make install
          chown -R postgres .

      - name: Run tests
        working-directory: pgturbohybrid
        run: |
          sudo -u postgres make installcheck
          sudo -u postgres make prove_installcheck

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-i386-regression
          path: |
            pgturbohybrid/regression.diffs
            pgturbohybrid/regression.out
            pgturbohybrid/log/
          if-no-files-found: ignore

  valgrind:
    name: valgrind pg18 pgvector-v0.8.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres-valgrind@v1
        with:
          postgres-version: 18
          check-ub: yes

      - name: Build and install upstream pgvector
        run: |
          PGVECTOR_DIR="${RUNNER_TEMP:-$PWD/.deps}/pgvector-v0.8.2"
          rm -rf "$PGVECTOR_DIR"
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$PGVECTOR_DIR"
          make -C "$PGVECTOR_DIR" OPTFLAGS=""
          sudo --preserve-env=PG_CONFIG make -C "$PGVECTOR_DIR" install
          createdb pgturbohybrid_pgvector_sanity
          psql -d pgturbohybrid_pgvector_sanity -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;"
          dropdb pgturbohybrid_pgvector_sanity

      - name: Build and install pgturbohybrid
        run: |
          make clean
          make OPTFLAGS=""
          sudo --preserve-env=PG_CONFIG make install

      - name: Run regression tests under valgrind
        run: make installcheck

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: valgrind-regression
          path: |
            regression.diffs
            regression.out
            log/
          if-no-files-found: ignore

  windows:
    name: windows pg${{ matrix.postgres }} pgvector-${{ matrix.pgvector_ref }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        postgres: [17]
        pgvector_ref: [v0.8.2, master]
    steps:
      - uses: actions/checkout@v6

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}

      - name: Build and install upstream pgvector
        shell: cmd
        env:
          PGVECTOR_REF: ${{ matrix.pgvector_ref }}
        run: |
          git clone --depth 1 --branch %PGVECTOR_REF% https://github.com/pgvector/pgvector.git "%RUNNER_TEMP%\pgvector-upstream"
          cd /d "%RUNNER_TEMP%\pgvector-upstream"
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" && ^
          nmake /NOLOGO /F Makefile.win && ^
          nmake /NOLOGO /F Makefile.win install

      - name: Build, install, and test pgturbohybrid
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" && ^
          nmake /NOLOGO /F Makefile.win && ^
          nmake /NOLOGO /F Makefile.win install && ^
          nmake /NOLOGO /F Makefile.win installcheck

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-pg${{ matrix.postgres }}-${{ matrix.pgvector_ref }}-regression
          path: |
            regression.diffs
            regression.out
            log/
          if-no-files-found: ignore
