name: pgxn

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: bundle and release
    runs-on: ubuntu-24.04
    container: pgxn/pgxn-tools
    env:
      # Releasing to PGXN only happens when these manager.pgxn.org creds exist.
      PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
      PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate META.json and build the PGXN bundle
        run: |
          pgxn-bundle
          ls -l ./*.zip

      - name: Release to PGXN
        if: github.ref_type == 'tag' && env.PGXN_USERNAME != ''
        run: pgxn-release

      - name: Upload bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgxn-bundle
          path: ./*.zip
          if-no-files-found: error

      - name: Attach bundle to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait for release.yml to create the release (with its PAT) rather than
          # creating it here -- a GITHUB_TOKEN-created release would not trigger
          # homebrew.yml.
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for release $GITHUB_REF_NAME ..."; sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" ./*.zip --clobber
